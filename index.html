<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CE Smart Evidence</title>
  <meta name="description" content="Photo & document evidence system for customer engineers — ATM and card/statement printers.">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="boot"><img src="assets/icons/icon.svg" alt="" width="72" height="72"><p>CE Smart Evidence</p></div>
  <noscript>CE Smart Evidence needs JavaScript enabled.</noscript>
  <script>
    if (location.protocol === 'file:') {
      document.body.innerHTML = '<div style="font-family:Segoe UI,Arial;max-width:560px;margin:60px auto;padding:24px;color:#e2e8f0;background:#111a2e;border-radius:14px;line-height:1.6">' +
        '<h2 style="margin-top:0">Please open the app the right way</h2>' +
        '<p>This page was opened directly as a file, which browsers block for apps like this.</p>' +
        '<p><b>Laptop:</b> close this tab and double-click <b>start-laptop.bat</b> in the same folder. The app opens at <b>http://localhost:8080</b>.</p>' +
        '<p><b>Phone:</b> open the published HTTPS address (see docs/SETUP_AND_DEPLOYMENT.md).</p></div>';
      document.body.style.background = '#070d1a';
    }
  </script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
